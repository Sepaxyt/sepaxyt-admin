<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SepaxYt Admin Panel — Login</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
    body { background: radial-gradient(circle at top, #0a1929 0%, #000814 100%); font-family: 'Segoe UI', Tahoma, sans-serif; }
    .glow { box-shadow: 0 0 40px rgba(0, 217, 255, 0.15); }
    .btn-glow:hover { box-shadow: 0 0 25px rgba(0, 217, 255, 0.6); }
    .input-glow:focus { box-shadow: 0 0 15px rgba(0, 217, 255, 0.4); }
</style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

<div class="w-full max-w-md">
    <div class="bg-slate-900/80 backdrop-blur-lg rounded-2xl p-8 glow border border-cyan-500/20">
        <div class="text-center mb-8">
            <div class="inline-block px-4 py-2 bg-gradient-to-r from-cyan-500 to-blue-500 rounded-lg mb-4">
                <span class="text-white font-bold text-xl tracking-wider">SEPAXYT</span>
            </div>
            <h1 class="text-2xl font-bold text-white mb-1">Admin Panel</h1>
            <p class="text-slate-400 text-sm">License Management System</p>
        </div>

        <form id="loginForm" class="space-y-5">
            <div>
                <label class="block text-cyan-400 text-sm font-semibold mb-2">🔐 Admin Password</label>
                <input type="password" id="password" placeholder="Enter password"
                    class="w-full px-4 py-3 bg-slate-800/70 border border-slate-700 rounded-lg text-white placeholder-slate-500 input-glow focus:outline-none focus:border-cyan-400 transition"
                    required>
            </div>

            <button type="submit"
                class="w-full py-3 bg-gradient-to-r from-cyan-500 to-blue-600 text-white font-bold rounded-lg btn-glow transition-all duration-300 transform hover:scale-[1.02]">
                🚀 LOGIN
            </button>
        </form>

        <div id="errorMsg" class="hidden mt-4 p-3 bg-red-500/20 border border-red-500/50 rounded-lg text-red-300 text-sm text-center"></div>

        <div class="mt-8 text-center">
            <p class="text-slate-500 text-xs">© 2026 SepaxYt • All Rights Reserved</p>
        </div>
    </div>
</div>

<script>
document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const password = document.getElementById('password').value;
    const errorMsg = document.getElementById('errorMsg');
    const btn = e.target.querySelector('button');

    errorMsg.classList.add('hidden');
    btn.disabled = true;
    btn.textContent = '⏳ Checking...';

    try {
        const res = await fetch('/api/auth', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ password })
        });
        const data = await res.json();

        if (data.success) {
            localStorage.setItem('sepaxyt_token', data.token);
            window.location.href = '/dashboard.html';
        } else {
            errorMsg.textContent = '❌ ' + (data.reason || 'Login failed');
            errorMsg.classList.remove('hidden');
        }
    } catch (err) {
        errorMsg.textContent = '❌ Server error: ' + err.message;
        errorMsg.classList.remove('hidden');
    } finally {
        btn.disabled = false;
        btn.textContent = '🚀 LOGIN';
    }
});
</script>

</body>
</html>
